name: Publish to npm

# Tag-driven release: `git tag v0.1.4 && git push origin v0.1.4` publishes.
# Publishing uses npm trusted publishing (OIDC): the run exchanges a short-lived
# id-token for a publish-only credential, so there is no repo secret to leak or
# rotate. Trust is already established (npm trust list shaleme):
#   provider github, repo Crosery/shaleme, file publish.yml, allow-publish.
# The FIRST publish of a package can never use OIDC (the trust hangs off an
# existing package), which is why 0.1.3 went out via local `npm publish
# --auth-type=web`. See docs/npm-publish-sop.md before anything here changes.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write # required for OIDC (trusted publishing + provenance)
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build bundle
        run: bun run build

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # never cache in release builds

      - name: Publish to npm
        # OIDC needs npm >= 11.5.1; node 24 bundles a newer one, but pin
        # explicitly so a runner image change cannot downgrade us silently.
        run: |
          npm --version | grep -q '^1[1-9]\.' || npm i -g npm@latest
          npm publish --access public --provenance
